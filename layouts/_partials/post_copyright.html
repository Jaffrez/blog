{{- if not (.Param "disableCopyright") }}
<div class="copy-details">
  <button class="copy-summary" type="button" aria-expanded="false" aria-controls="copyright-content">
    版权信息（点此展开）
  </button>
  <div class="copy-content" id="copyright-content" hidden>
    <div class="copy-content-inner">
      <p>标题：{{ .Title }}</p>
      <p>作者：{{ site.Params.author | default site.Title }}</p>
      <p>链接：<a href="{{ .Permalink }}">{{ .Permalink }}</a></p>
      <p>协议：<a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh">CC BY-NC-SA 4.0</a></p>
    </div>
  </div>
</div>
{{- end }}
