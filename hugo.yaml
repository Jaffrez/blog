baseURL: "https://jaffrez.io"
locale: "zh-cn"
defaultContentLanguage: "zh"
title: "Jaffrez's Blog"
theme: "PaperMod"

enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: true

permalinks:
  posts: "/posts/:slug/"

params:
  mainSections:
    - "posts"
  author: "Jaffrez"
  comments: true
  keywords:
    - "blog"
    - "Jaffrez"
  DateFormat: "2006-01-02"
  defaultTheme: "dark"
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  showtoc: true

  homeInfoParams:
    Title: "Hi! I'm Jaffrez 👋"
    Content: "一名热衷于计算机的学生。"

  images:
    - "avatar.jpg"

  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari_pinned_tab.svg"

  socialIcons:
    - name: "github"
      url: "https://github.com/Jaffrez/"
    - name: "email"
      url: "mailto:Jaffrez@outlook.com"
    - name: "rss"
      url: "/index.xml"

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  editPost:
    URL: "https://github.com/Jaffrez/blog/tree/master/content"
    Text: "指出问题"
    appendFilePath: true

  fuseOpts:
    limit: 10

  footer:
    text: "Analytics by [Umami](https://umami.is)"

  integrations:
    fonts:
      enabled: true
      stylesheets:
        - "https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.min.css"
        - "https://cdn.jsdelivr.net/npm/@fontsource/maple-mono@5.2.6/index.min.css"
    mediumZoom:
      enabled: true
      scriptURL: "https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js"
    giscus:
      enabled: true
      scriptURL: "https://giscus.app/client.js"
      repo: "Jaffrez/blog"
      repoID: "R_kgDOTfLVIQ"
      category: "Announcements"
      categoryID: "DIC_kwDOTfLVIc4DBtMS"
      mapping: "title"
      strict: "1"
      reactionsEnabled: "1"
      emitMetadata: "0"
      inputPosition: "top"
      theme: "noborder_dark"
      lang: "zh-CN"
      loading: "lazy"
    umami:
      enabled: true
      scriptURL: "https://cloud.umami.is/script.js"
      websiteID: "bc17e884-58c9-4281-9769-4a04d9887ade"

markup:
  highlight:
    noClasses: false
    lineNos: true
    codeFences: true

taxonomies:
  tag: tags

menu:
  main:
    - identifier: "search"
      name: "搜索"
      pageRef: "/search"
      weight: 10
    - identifier: "archives"
      name: "文章"
      pageRef: "/archives"
      weight: 30
    - identifier: "about"
      name: "关于我"
      pageRef: "/about"
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON
